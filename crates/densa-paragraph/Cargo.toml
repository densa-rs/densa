[package]
name = "densa-paragraph"
description = "Paragraph layout for densa on parley: shaping, wrapping, bidi, alignment, hit-testing and selection"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["text", "layout", "paragraph", "bidi", "selection"]
categories = ["gui", "text-processing"]

[features]
default = ["system-fonts"]
# Find the operating system's fonts: fallback for characters the bundled font lacks (Korean,
# Japanese, Chinese, symbols, ...) and named families. `TextSystem::new` uses them.
system-fonts = ["parley/system", "dep:fontique", "fontique/fontconfig-dlopen"]
# Dictionary data for word breaks in Chinese and Japanese and line breaks in Thai, Lao, Khmer
# and Burmese (adds several MB to the binary). Without it those break as other scripts do.
complex-scripts = ["parley/complex-scripts"]

[dependencies]
densa-core.workspace = true
densa-text.workspace = true
fontique = { workspace = true, optional = true }
parley.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
densa-alloc.workspace = true
densa-draw.workspace = true
densa-grid.workspace = true
densa-render.workspace = true
pollster.workspace = true
winit.workspace = true
wgpu.workspace = true

[lints]
workspace = true
