[package]
name = "densa-paragraph"
description = "Paragraph layout for densa on parley: shaping, wrapping, bidi, alignment, hit-testing and selection"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["text", "layout", "paragraph", "bidi", "selection"]
categories = ["gui", "text-processing"]

[features]
# Discover the operating system's fonts for families and fallback (CJK, symbols, ...).
system-fonts = ["parley/system"]

[dependencies]
densa-core.workspace = true
densa-text.workspace = true
parley.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
densa-alloc.workspace = true
densa-draw.workspace = true
densa-grid.workspace = true
densa-render.workspace = true
pollster.workspace = true
winit.workspace = true
wgpu.workspace = true

[lints]
workspace = true
