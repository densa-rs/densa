[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
densa-alloc = { path = "crates/densa-alloc" }
densa-data = { path = "crates/densa-data" }
densa-engine = { path = "crates/densa-engine" }
densa-fmt = { path = "crates/densa-fmt" }
densa-sync = { path = "crates/densa-sync" }

criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
crossbeam-utils = "0.8.23"
loom = "0.7.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
