[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://densa.dev"
# Verified with `cargo +1.90 check --workspace --all-targets`; set by wgpu-hal's
# ordered-float dependency (wgpu 30 itself needs 1.87).
rust-version = "1.90"

[workspace.dependencies]
densa-alloc = { path = "crates/densa-alloc" }
densa-data = { path = "crates/densa-data" }
densa-engine = { path = "crates/densa-engine" }
densa-fmt = { path = "crates/densa-fmt" }
densa-platform = { path = "crates/densa-platform" }
densa-render = { path = "crates/densa-render" }
densa-sync = { path = "crates/densa-sync" }
densa-text = { path = "crates/densa-text" }

bytemuck = "1.25.2"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
crossbeam-utils = "0.8.23"
etagere = "0.3.0"
font8x8 = { version = "0.3.1", default-features = false }
loom = "0.7.2"
pollster = "1.0.1"
rustc-hash = "2.1.3"
skrifa = "0.48.0"
wgpu = "30.0.1"
windows-sys = "0.61.2"
winit = "0.30.13"
zeno = "0.3.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
