[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://densa.dev"
repository = "https://github.com/densa-rs/densa"
readme = "README.md"
# Verified with `cargo +1.90 check --workspace --all-targets`; set by wgpu-hal's
# ordered-float dependency (wgpu 30 itself needs 1.87).
rust-version = "1.90"

[workspace.dependencies]
# Screen readers: densa-window turns densa-ui's accessibility tree into the platform's.
accesskit = "0.25.1"
accesskit_winit = "0.34.1"
# Text only: its default image support would pull in the image crate.
arboard = { version = "3.7.0", default-features = false }
densa-alloc = { path = "crates/densa-alloc", version = "0.2.5" }
densa-arrow = { path = "crates/densa-arrow", version = "0.2.5" }
densa-chart = { path = "crates/densa-chart", version = "0.2.5" }
densa-core = { path = "crates/densa-core", version = "0.2.5" }
densa-data = { path = "crates/densa-data", version = "0.2.5" }
densa-draw = { path = "crates/densa-draw", version = "0.2.5" }
densa-fmt = { path = "crates/densa-fmt", version = "0.2.5" }
densa-grid = { path = "crates/densa-grid", version = "0.2.5" }
# Without default features: densa-window decides (and forwards) whether system fonts are on.
densa-paragraph = { path = "crates/densa-paragraph", version = "0.2.5", default-features = false }
densa-platform = { path = "crates/densa-platform", version = "0.2.5" }
densa-render = { path = "crates/densa-render", version = "0.2.5" }
densa-sync = { path = "crates/densa-sync", version = "0.2.5" }
densa-text = { path = "crates/densa-text", version = "0.2.5" }
densa-ui = { path = "crates/densa-ui", version = "0.2.5" }
densa-widgets = { path = "crates/densa-widgets", version = "0.2.5" }
densa-window = { path = "crates/densa-window", version = "0.2.5" }
# The demo application (not published).
trading-demo = { path = "examples/trading-demo" }

# Apache Arrow: only the array and schema crates, not the `arrow` umbrella (compute, IO).
arrow-array = { version = "60.0.0", default-features = false }
arrow-buffer = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
arrow-select = { version = "60.0.0", default-features = false }
bytemuck = "1.25.2"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
crossbeam-utils = "0.8.23"
etagere = "0.3.0"
loom = "0.7.2"
# No default features: system fonts and complex-script data are densa-paragraph features.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
# parley's font collection, named only to load fontconfig at run time on Linux (no build-time
# headers; without fontconfig, text falls back to the bundled font). Same version as parley's.
fontique = { version = "0.12.0", default-features = false }
pollster = "1.0.1"
rustc-hash = "2.1.3"
# Same version as parley_engine 0.12 uses: one font parser in the binary, not two.
# Upgrade together with parley (`cargo tree -d` must not list skrifa or read-fonts).
skrifa = "0.44.0"
# Flexbox layout for densa-ui; grid and CSS parsing not compiled in.
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }
wgpu = "30.0.1"
windows-sys = "0.61.2"
winit = "0.30.13"
zeno = "0.3.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
